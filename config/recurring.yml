#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  delete_stale_rails_builders_registrations:
    class: CleanupStaleRegistrationsJob
    schedule: every day at 3am
  delete_expired_login_sessions:
    command: "LoginSession.where(created_at: ..400.days.ago).delete_all"
    schedule: every day at 3:10am
  send_product_digest:
    class: ProductDigestJob
    schedule: at 12:05am every day
  sync_builder_session_calendars:
    class: GoogleCalendarSyncJob
    schedule: every hour at minute 20
  maintain_active_builder_sessions:
    class: BuilderSessionMaintenanceJob
    schedule: every minute
  send_session_reminders:
    class: SessionReminderJob
    schedule: every minute
  finish_session_cancellations:
    class: SessionCancellationJob
    schedule: every minute
  enforce_attendance_strike_limit:
    class: StrikeLimitJob
    schedule: every minute
  import_google_meet_transcripts:
    class: GoogleMeetTranscriptImportJob
    schedule: every 5 minutes
