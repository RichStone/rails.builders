<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>That request could not be read (400 Bad Request)</title>
<style>
  :root {
    --ink: #24181a; --muted: #715f62; --paper: #fffaf6; --cream: #f7ede6;
    --ruby: #d4143d; --ruby-dark: #7d0b25;
    --line: rgba(76, 22, 34, .14); --shadow: 0 24px 70px rgba(70, 6, 23, .12); --radius: 22px;
    --sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ink); background: var(--paper); font: 16px/1.6 var(--sans);
  }
  .brand { display: flex; gap: 9px; align-items: center; margin-bottom: 28px; font-family: var(--display); }
  .brand-gem { color: var(--ruby); transform: rotate(45deg); display: inline-block; font-size: 14px; }
  .brand-lockup { display: grid; gap: 4px; }
  .brand-name { font-size: 18px; font-weight: 700; line-height: 1; }
  .brand-est { color: var(--muted); font: 700 8px/1 var(--sans); letter-spacing: .13em; white-space: nowrap; }
  .card {
    max-width: 560px; width: 100%; padding: 46px 40px; text-align: center;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--cream); box-shadow: var(--shadow);
  }
  .eyebrow { margin: 0 0 13px; color: var(--ruby); font-size: 12px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
  h1 { margin: 0 0 14px; font-family: var(--display); font-size: clamp(30px, 5vw, 42px); line-height: 1.05; letter-spacing: -.045em; }
  p { margin: 0 0 1em; color: var(--muted); }
  p:last-of-type { margin-bottom: 0; }
  .actions { margin-top: 28px; }
  .button {
    min-height: 48px; padding: 0 22px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    color: white; background: var(--ruby); font-weight: 700; text-decoration: none;
    box-shadow: 0 12px 28px rgba(212, 20, 61, .24);
  }
  .button:hover { background: #bd0f35; }
  .button:focus-visible { outline: 3px solid #ff6c62; outline-offset: 3px; }
</style>
</head>
<body>
  <span class="brand">
    <span class="brand-gem">&#9670;</span>
    <span class="brand-lockup">
      <span class="brand-name">Rails.Builders</span>
      <span class="brand-est">--- Est. 2025 ---</span>
    </span>
  </span>
  <main class="card">
    <p class="eyebrow">400 &middot; Bad request</p>
    <h1>That request could not be read.</h1>
    <p>Something in the request was malformed, so nothing was changed. Reloading the page and trying once more usually clears it.</p>
    <div class="actions"><a class="button" href="/">Back to Rails.Builders</a></div>
  </main>
</body>
</html>
